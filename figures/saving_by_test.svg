<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 384" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Saving from the 200k cap: simulator 35%, 39% with subagents on Sonnet 5.5, 26% without the biggest session; real logs per call 45% on Opus 5.5, 7% on Fable 5.2, 14% more on Sonnet 5.5; controlled test no difference">
  <!-- Numbers: README 'The result' table and STUDY.md sections 2, 3 and 9. Bar width = 5.2 px per 1%. -->
  <text x="0.0" y="22.0" font-size="17" text-anchor="start" fill="#8b949e" font-weight="600">What the 200k cap saved, test by test</text>
  <text x="0.0" y="44.0" font-size="13" text-anchor="start" fill="#8b949e">Bars to the right are savings. Bars to the left mean the cap cost more.</text>
  <line x1="296.0" y1="70.0" x2="296.0" y2="310.0" stroke="#8b949e" stroke-width="0.5" stroke-dasharray="2 4"/>
  <text x="296.0" y="326.0" font-size="11" text-anchor="middle" fill="#8b949e">-20%</text>
  <line x1="400.0" y1="70.0" x2="400.0" y2="310.0" stroke="#8b949e" stroke-width="1"/>
  <text x="400.0" y="326.0" font-size="11" text-anchor="middle" fill="#8b949e">0%</text>
  <line x1="504.0" y1="70.0" x2="504.0" y2="310.0" stroke="#8b949e" stroke-width="0.5" stroke-dasharray="2 4"/>
  <text x="504.0" y="326.0" font-size="11" text-anchor="middle" fill="#8b949e">20%</text>
  <line x1="608.0" y1="70.0" x2="608.0" y2="310.0" stroke="#8b949e" stroke-width="0.5" stroke-dasharray="2 4"/>
  <text x="608.0" y="326.0" font-size="11" text-anchor="middle" fill="#8b949e">40%</text>
  <text x="392.0" y="66.0" font-size="12" text-anchor="end" fill="#8b949e" font-weight="600">← cap cost more</text>
  <text x="408.0" y="66.0" font-size="12" text-anchor="start" fill="#8b949e" font-weight="600">cap saved →</text>
  <text x="270.0" y="93.0" font-size="13" text-anchor="end" fill="#8b949e">Month replayed with the cap</text>
  <rect x="400.0" y="78.0" width="182.0" height="22.0" rx="3" fill="#bf8700" fill-opacity="1.0"/>
  <line x1="540.4" y1="89.0" x2="597.6" y2="89.0" stroke="#57606a" stroke-width="2"/>
  <line x1="540.4" y1="82.0" x2="540.4" y2="96.0" stroke="#57606a" stroke-width="2"/>
  <line x1="597.6" y1="82.0" x2="597.6" y2="96.0" stroke="#57606a" stroke-width="2"/>
  <text x="605.6" y="94.0" font-size="13" text-anchor="start" fill="#8b949e" font-weight="600">35%  (27% to 38%)</text>
  <text x="270.0" y="127.0" font-size="13" text-anchor="end" fill="#8b949e">Same, plus subagents on Sonnet 5.5</text>
  <rect x="400.0" y="112.0" width="202.8" height="22.0" rx="3" fill="#bf8700" fill-opacity="1.0"/>
  <text x="610.8" y="128.0" font-size="13" text-anchor="start" fill="#8b949e" font-weight="600">39%</text>
  <text x="270.0" y="161.0" font-size="13" text-anchor="end" fill="#8b949e">Same, without my biggest session</text>
  <rect x="400.0" y="146.0" width="135.2" height="22.0" rx="3" fill="#bf8700" fill-opacity="1.0"/>
  <line x1="493.6" y1="157.0" x2="550.8" y2="157.0" stroke="#57606a" stroke-width="2"/>
  <line x1="493.6" y1="150.0" x2="493.6" y2="164.0" stroke="#57606a" stroke-width="2"/>
  <line x1="550.8" y1="150.0" x2="550.8" y2="164.0" stroke="#57606a" stroke-width="2"/>
  <text x="558.8" y="162.0" font-size="13" text-anchor="start" fill="#8b949e" font-weight="600">26%  (18% to 29%)</text>
  <text x="270.0" y="195.0" font-size="13" text-anchor="end" fill="#8b949e">Real logs, per call, Opus 5.5</text>
  <rect x="400.0" y="180.0" width="234.0" height="22.0" rx="3" fill="#0969da" fill-opacity="1.0"/>
  <text x="642.0" y="196.0" font-size="13" text-anchor="start" fill="#8b949e" font-weight="600">45%</text>
  <text x="270.0" y="229.0" font-size="13" text-anchor="end" fill="#8b949e">Real logs, per call, Fable 5.2</text>
  <rect x="400.0" y="214.0" width="36.4" height="22.0" rx="3" fill="#0969da" fill-opacity="1.0"/>
  <text x="444.4" y="230.0" font-size="13" text-anchor="start" fill="#8b949e" font-weight="600">7%</text>
  <text x="270.0" y="263.0" font-size="13" text-anchor="end" fill="#8b949e">Real logs, per call, Sonnet 5.5</text>
  <rect x="327.2" y="248.0" width="72.8" height="22.0" rx="3" fill="#0969da" fill-opacity="1.0"/>
  <text x="414.0" y="264.0" font-size="13" text-anchor="start" fill="#8b949e" font-weight="600">14% more</text>
  <text x="270.0" y="297.0" font-size="13" text-anchor="end" fill="#8b949e">Controlled test, 35-prompt task</text>
  <circle cx="400.0" cy="293.0" r="7" fill="#8250df"/>
  <text x="414.0" y="298.0" font-size="13" text-anchor="start" fill="#8b949e" font-weight="600">no difference (runs overlap)</text>
  <rect x="0.0" y="345.0" width="12.0" height="12.0" rx="2" fill="#bf8700" fill-opacity="1.0"/>
  <text x="18.0" y="356.0" font-size="13" text-anchor="start" fill="#8b949e">estimated: the simulator replays my month</text>
  <rect x="317.0" y="345.0" width="12.0" height="12.0" rx="2" fill="#0969da" fill-opacity="1.0"/>
  <text x="335.0" y="356.0" font-size="13" text-anchor="start" fill="#8b949e">computed: real logs, before and after</text>
  <rect x="0.0" y="365.0" width="12.0" height="12.0" rx="2" fill="#8250df" fill-opacity="1.0"/>
  <text x="18.0" y="376.0" font-size="13" text-anchor="start" fill="#8b949e">controlled test: the same task with the cap off and on, median of 3 runs</text>
</svg>
